name: Build Standalone Windows Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.5)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build PySide6 Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            # Auto-increment patch version from latest tag
            LATEST=$(git tag --sort=-version:refname | grep -E 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if [ -z "$LATEST" ]; then
              VERSION="v1.0.5"
            else
              # Increment patch number
              MAJOR=$(echo $LATEST | cut -d. -f1 | tr -d 'v')
              MINOR=$(echo $LATEST | cut -d. -f2)
              PATCH=$(echo $LATEST | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'unified_dashboard/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyinstaller-hooks-contrib
          python -m pip install -r unified_dashboard/requirements.txt

      - name: Build Executable with PyInstaller
        working-directory: unified_dashboard
        run: |
          python -m PyInstaller build.spec --clean --noconfirm

      - name: Verify Executable Exists
        run: |
          if (Test-Path "unified_dashboard/dist/UnifiedDashboard.exe") {
            $size = (Get-Item "unified_dashboard/dist/UnifiedDashboard.exe").Length / 1MB
            Write-Host "Success: UnifiedDashboard.exe built ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Error "UnifiedDashboard.exe not found in dist/"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedDashboard-Windows-EXE
          path: unified_dashboard/dist/UnifiedDashboard.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Unified System Automation Suite ${{ steps.version.outputs.version }} (Ready-to-Execute)"
          draft: false
          prerelease: false
          files: unified_dashboard/dist/UnifiedDashboard.exe
          body: |
            ## 🚀 Unified System Automation Suite ${{ steps.version.outputs.version }}

            This release provides a single, portable, ready-to-run `.exe` for Windows.

            ### Instructions for Users:
            1. Download **`UnifiedDashboard.exe`** from the Assets list below.
            2. Double-click **`UnifiedDashboard.exe`** to launch the dashboard.
            3. **No Python or command-line installation required.**
            4. *Note: Google Chrome must be installed on your computer for automation tasks.*
